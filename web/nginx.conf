# C 端站点的 Nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 三个关键点：
# 1) `/api/` 反代主服务，**流式（SSE）必须关缓冲**，否则回答会"憋到最后一次性蹦出来"；
# 2) **管理面接口不过公网**：`/api/admin/*` 与 `/internal/*` 直接 404
#    （后台系统直连主服务，见 ai/06 §7 坑 9）；
# 3) SPA 路由回退 + 静态资源长缓存 + index.html 不缓存（发版即时生效）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 客户端上传/请求体上限（对话接口很小，给足余量即可）
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------------------------------------------------------------- API 反代
    location /api/ {
        # 注意：proxy_pass 不带路径 → 原样透传 `/api/...`
        proxy_pass http://server:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE：清空 Connection，避免按 keep-alive 复用连接导致分片被攒住
        proxy_set_header Connection "";

        # ★ 流式对话的关键三行
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 管理面接口不经过公网前端（X-Admin-Key 是"够用"，不是"该暴露"）
    location /api/admin/ { return 404; }
    location /internal/  { return 404; }

    # ---------------------------------------------------------------- 静态资源
    # Vite 产物带内容 hash，可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 入口文件不缓存，保证发版后用户拿到新资源引用
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查（容器 HEALTHCHECK 用；不依赖上游）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
